name: Build

# Builds the three flavours of the app and uploads them as artefacts:
#   Linux   -> .deb, .rpm and a tarball
#   Windows -> the .exe with the Qt libraries next to it
#   Android -> the .apk
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # Qt is installed with aqt directly (the wrapper action is fragile with
  # the Python of the runners). The base module is called "qt_base" (and
  # not "qtbase") and that name only exists from 6.6 onwards, so every
  # flavour is built with the same version.
  QT_VERSION: '6.6.3'

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Qt
        run: |
          python3 -m pip install --break-system-packages "aqtinstall==3.3.0"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          aqt install-qt linux desktop ${{ env.QT_VERSION }} gcc_64 -m qt_base qtmultimedia -O "$RUNNER_TEMP/qt"
          echo "QT_PREFIX=$RUNNER_TEMP/qt/${{ env.QT_VERSION }}/gcc_64" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/qt/${{ env.QT_VERSION }}/gcc_64" >> $GITHUB_ENV
          echo "$RUNNER_TEMP/qt/${{ env.QT_VERSION }}/gcc_64/lib" >> $GITHUB_LD_LIBRARY_PATH

      - name: Dependencias de ejecución
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv2 yt-dlp python3 libgl1-mesa-dri dpkg-dev fakeroot

      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build

      - name: Empaquetar
        run: |
          cd build
          cpack -G DEB
          cpack -G RPM
          cpack -G TGZ

      - uses: actions/upload-artifact@v4
        with:
          name: lotus-tune-linux
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Qt
        # The command is in ONE line: the backslash continuation is not
        # understood by the shell of the runner. The architecture is
        # win64_msvc2019_64 and the base module is implicit there.
        run: |
          python -m pip install "aqtinstall==3.3.0"
          echo "$env:USERPROFILE\AppData\Roaming\Python\Python3\Scripts" >> $env:GITHUB_PATH
          aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_msvc2019_64 -m qtmultimedia -O "$env:RUNNER_TEMP\qt"
          "QT_PREFIX=$env:RUNNER_TEMP\qt\${{ env.QT_VERSION }}\msvc2019_64" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$env:RUNNER_TEMP\qt\${{ env.QT_VERSION }}\msvc2019_64" >> $env:GITHUB_ENV

      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Empaquetar (windeployqt)
        shell: pwsh
        run: |
          & "$env:QT_PREFIX\bin\windeployqt.exe" --release --no-translations --no-opengl-sw `
             "build\lotus-tune.exe"
          Copy-Item tools\ytm_login.py, tools\ytm_api.py build\ -ErrorAction SilentlyContinue
          Compress-Archive -Path build\* -DestinationPath lotus-tune-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: lotus-tune-windows
          path: lotus-tune-windows.zip

  android:
    name: Android (APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Qt (host y target)
        run: |
          python3 -m pip install --break-system-packages "aqtinstall==3.3.0"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          # The host Qt brings the tools (moc, rcc, androiddeployqt).
          aqt install-qt linux desktop ${{ env.QT_VERSION }} gcc_64 -m qt_base qtmultimedia -O "$RUNNER_TEMP/qt-host"
          # The target Qt brings the libraries for the phone.
          aqt install-qt linux android ${{ env.QT_VERSION }} android_arm64_v8a -m qt_base qtmultimedia qtnetworkauth qtshadertools -O "$RUNNER_TEMP/qt-android"
          echo "QT_PREFIX=$RUNNER_TEMP/qt-android/${{ env.QT_VERSION }}/android_arm64_v8a" >> $GITHUB_ENV
          echo "QT_HOST_PATH=$RUNNER_TEMP/qt-host/${{ env.QT_VERSION }}/gcc_64" >> $GITHUB_ENV

      - name: JDK 17
        # Gradle 8 does not work with the JDK 27 of the runners.
        run: |
          mkdir -p "$RUNNER_TEMP/jdk"
          curl -sL "https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jdk/hotspot/normal/eclipse" -o "$RUNNER_TEMP/jdk.tar.gz"
          tar xzf "$RUNNER_TEMP/jdk.tar.gz" -C "$RUNNER_TEMP/jdk" --strip-components=1
          echo "JAVA_HOME=$RUNNER_TEMP/jdk" >> $GITHUB_ENV
          echo "$RUNNER_TEMP/jdk/bin" >> $GITHUB_PATH

      - name: SDK de Android
        # The command line tools are installed by hand: the action that does
        # it fails with the SDK of the runner.
        run: |
          mkdir -p "$RUNNER_TEMP/android-sdk/cmdline-tools"
          curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$RUNNER_TEMP/cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/android-sdk/cmdline-tools"
          mv "$RUNNER_TEMP/android-sdk/cmdline-tools/cmdline-tools" "$RUNNER_TEMP/android-sdk/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> $GITHUB_ENV
          SDKMAN="$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMAN" --licenses > /dev/null 2>&1 || true
          "$SDKMAN" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Compilar el APK
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_SDK_ROOT/ndk/27.0.12077973/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_SDK_ROOT=$ANDROID_SDK_ROOT \
            -DQt6_DIR=$QT_PREFIX/lib/cmake/Qt6 \
            -DQT_HOST_PATH=$QT_HOST_PATH \
            -DCMAKE_FIND_ROOT_PATH=$QT_PREFIX \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH
          # The library with CMake and the package with Gradle: the target
          # that Qt adds for the APK fails on a missing dep file.
          cmake --build build-android --target lotus-tune
          ( cd build-android/android-build && ./gradlew assembleDebug --no-daemon )
          find build-android -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/lotus-tune-android.apk \;

      - uses: actions/upload-artifact@v4
        with:
          name: lotus-tune-android
          path: lotus-tune-android.apk
