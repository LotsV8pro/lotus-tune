// Gradle build of the Android flavour.
//
// It is generated by Qt (the QML files and the libraries come from the
// Qt6 for Android installation) and it only adds the parts that are
// specific to this app: the package name, the icon, the permissions and
// the activity that shows the QML.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'io.github.lotsv8pro.lotustune'
    compileSdk 34
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "io.github.lotsv8pro.lotustune"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            // Signed with the debug key so the APK can be installed
            // without a key store (the release workflow signs it with the
            // real one when the secrets are present).
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
